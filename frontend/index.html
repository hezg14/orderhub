<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="OrderHub — orders, customers and stock for small wholesale teams" />
    <title>OrderHub</title>
    <!-- Brand favicon: the route motif, inlined so no extra request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='4' y1='28' x2='28' y2='4' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%234f46e5'/%3E%3Cstop offset='.55' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1' y='1' width='30' height='30' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 23c0-6 14-2 14-12' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='9' cy='23' r='2.7' fill='%23fff'/%3E%3Ccircle cx='16.4' cy='16.4' r='2' stroke='%23fff' stroke-width='1.7' fill='none'/%3E%3Ccircle cx='23' cy='11' r='2.7' fill='%23fff'/%3E%3C/svg%3E"
    />
    <!-- Preconnect to the API origin cuts ~80ms off the first XHR on a cold load. -->
    <!-- Theme bootstrap: dark is the default. Runs before paint so the boot
         shell never flashes light for users who chose light. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('orderhub.theme');
          var dark = saved ? saved === 'dark' : true;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Static shell painted before the JS bundle executes. The loader is
           the brand route animation, inlined to avoid any extra request. -->
      <div class="boot-shell">
        <svg width="52" height="52" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="boot-g" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4f46e5" />
              <stop offset="0.55" stop-color="#7c3aed" />
              <stop offset="1" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#boot-g)" />
          <path
            d="M9 23c0-6 14-2 14-12"
            stroke="#fff"
            stroke-width="2.6"
            stroke-linecap="round"
            pathLength="100"
            stroke-dasharray="100"
            style="animation: boot-route 1.8s ease-in-out infinite"
          />
          <circle cx="9" cy="23" r="2.7" fill="#fff" />
          <circle cx="16.4" cy="16.4" r="2" stroke="#fff" stroke-width="1.7" fill="none" />
          <circle cx="23" cy="11" r="2.7" fill="#fff" />
        </svg>
        <div class="boot-sub">OrderHub</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <style>
      .boot-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        justify-items: center;
        background: #f6f7fb;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .boot-sub {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #5c637a;
      }
      html.dark .boot-shell {
        background: #0b0d16;
      }
      html.dark .boot-sub {
        color: #9aa3bd;
      }
      @keyframes boot-route {
        0% {
          stroke-dashoffset: 100;
        }
        55%,
        100% {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </body>
</html>
